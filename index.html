<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech Career Explorer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ES Modules Import Map for React and Lucide -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
            }
        }
    </script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { BookOpen, Code, Lightbulb, Users, MonitorPlay, Briefcase, GraduationCap, TrendingUp, ChevronRight, Search } from 'lucide-react';

        const CAREERS = [
          {
            id: 'instructional-designer',
            title: 'Instructional Designer',
            icon: <BookOpen className="w-6 h-6 text-blue-500" />,
            description: 'Designs and develops educational programs, courses, and learning materials leveraging technology to enhance the learning experience.',
            salary: '$65k - $95k',
            skills: ['Curriculum Design', 'E-Learning Authoring (Articulate, Captivate)', 'Learning Management Systems (LMS)'],
          },
          {
            id: 'edtech-engineer',
            title: 'EdTech Software Engineer',
            icon: <Code className="w-6 h-6 text-indigo-500" />,
            description: 'Builds the platforms, applications, and tools that power digital learning, from student dashboards to backend grading algorithms.',
            salary: '$90k - $160k+',
            skills: ['Full-Stack Development', 'Cloud Architecture', 'Data Privacy (FERPA/COPPA)', 'Accessibility (WCAG)'],
          },
          {
            id: 'product-manager',
            title: 'EdTech Product Manager',
            icon: <Lightbulb className="w-6 h-6 text-amber-500" />,
            description: 'Guides the vision, development, and success of educational products, bridging the gap between engineering, design, and educators.',
            salary: '$100k - $150k+',
            skills: ['Product Strategy', 'User Research (Teachers & Students)', 'Agile Methodologies', 'Data Analytics'],
          },
          {
            id: 'customer-success',
            title: 'Customer Success Manager',
            icon: <Users className="w-6 h-6 text-green-500" />,
            description: 'Ensures schools, universities, or corporate clients are successfully adopting and utilizing the EdTech product to achieve their learning goals.',
            salary: '$60k - $90k',
            skills: ['Relationship Management', 'Onboarding & Training', 'Problem Solving', 'Educational Empathy'],
          },
          {
            id: 'learning-analytics',
            title: 'Learning Data Analyst',
            icon: <TrendingUp className="w-6 h-6 text-purple-500" />,
            description: 'Analyzes student engagement and performance data to provide insights that improve educational outcomes and product design.',
            salary: '$75k - $115k',
            skills: ['SQL/Python', 'Data Visualization (Tableau/Looker)', 'Statistical Analysis', 'A/B Testing'],
          },
          {
            id: 'sales-executive',
            title: 'EdTech Sales Executive',
            icon: <Briefcase className="w-6 h-6 text-rose-500" />,
            description: 'Partners with school districts or institutions to understand their needs and sell appropriate technological solutions.',
            salary: '$70k - $130k+ (with commission)',
            skills: ['B2B/B2G Sales', 'Negotiation', 'Understanding of School Budgets', 'Presentation Skills'],
          }
        ];

        function App() {
          const [searchTerm, setSearchTerm] = useState('');

          const filteredCareers = CAREERS.filter(career => 
            career.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
            career.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
            career.skills.some(skill => skill.toLowerCase().includes(searchTerm.toLowerCase()))
          );

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
              {/* Navigation */}
              <nav className="bg-white border-b border-slate-200 sticky top-0 z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between h-16 items-center">
                    <div className="flex items-center gap-2">
                      <GraduationCap className="w-8 h-8 text-indigo-600" />
                      <span className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-600">
                        EdTechCareers
                      </span>
                    </div>
                    <div className="hidden md:flex space-x-8">
                      <a href="#" className="text-slate-600 hover:text-indigo-600 font-medium">Explore Roles</a>
                      <a href="#" className="text-slate-600 hover:text-indigo-600 font-medium">Industry Trends</a>
                      <a href="#" className="text-slate-600 hover:text-indigo-600 font-medium">Resources</a>
                    </div>
                  </div>
                </div>
              </nav>

              {/* Hero Section */}
              <section className="bg-indigo-900 text-white py-20 relative overflow-hidden">
                <div className="absolute inset-0 opacity-10">
                  <div className="absolute top-0 -left-4 w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
                  <div className="absolute top-0 -right-4 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
                  <div className="absolute -bottom-8 left-20 w-72 h-72 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
                </div>
                
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <div className="text-center max-w-3xl mx-auto">
                    <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight mb-6">
                      Shape the Future of <span className="text-blue-400">Learning</span>
                    </h1>
                    <p className="text-lg md:text-xl text-indigo-100 mb-10">
                      Discover rewarding career paths at the intersection of education and technology. Build tools that empower students and educators globally.
                    </p>
                    
                    {/* Search Bar */}
                    <div className="relative max-w-xl mx-auto">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Search className="h-5 w-5 text-slate-400" />
                      </div>
                      <input
                        type="text"
                        className="block w-full pl-10 pr-3 py-4 border-transparent rounded-full leading-5 bg-white text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-4 focus:ring-blue-400 focus:ring-opacity-50 transition-all shadow-lg text-lg"
                        placeholder="Search roles, skills, or keywords..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>
                  </div>
                </div>
              </section>

              {/* Main Content */}
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                
                <div className="mb-12 text-center">
                  <h2 className="text-3xl font-bold text-slate-900 mb-4">Explore Career Paths</h2>
                  <p className="text-slate-600 max-w-2xl mx-auto">
                    Whether you are a former teacher, a software engineer, or a business strategist, there is a place for you in EdTech.
                  </p>
                </div>

                {/* Careers Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {filteredCareers.length > 0 ? (
                    filteredCareers.map((career) => (
                      <div key={career.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full">
                        <div className="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center mb-6 border border-slate-100">
                          {career.icon}
                        </div>
                        
                        <h3 className="text-xl font-bold text-slate-900 mb-3">{career.title}</h3>
                        <p className="text-slate-600 mb-6 flex-grow">{career.description}</p>
                        
                        <div className="space-y-4">
                          <div>
                            <h4 className="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2">Key Skills</h4>
                            <div className="flex flex-wrap gap-2">
                              {career.skills.map((skill, idx) => (
                                <span key={idx} className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                                  {skill}
                                </span>
                              ))}
                            </div>
                          </div>
                          
                          <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                            <div className="flex flex-col">
                              <span className="text-xs text-slate-500 font-medium">Avg. Salary Range</span>
                              <span className="text-sm font-bold text-slate-900">{career.salary}</span>
                            </div>
                            <button className="text-indigo-600 hover:text-indigo-800 p-2 rounded-full hover:bg-indigo-50 transition-colors">
                              <ChevronRight className="w-5 h-5" />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="col-span-full py-12 text-center">
                      <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4">
                        <Search className="w-8 h-8 text-slate-400" />
                      </div>
                      <h3 className="text-lg font-medium text-slate-900">No roles found</h3>
                      <p className="text-slate-500 mt-1">Try adjusting your search terms.</p>
                    </div>
                  )}
                </div>

                {/* Why EdTech Section */}
                <section className="mt-24 bg-white rounded-3xl p-8 md:p-12 border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-12">
                  <div className="flex-1">
                    <h2 className="text-3xl font-bold text-slate-900 mb-6">Why Work in EdTech?</h2>
                    <ul className="space-y-6">
                      <li className="flex gap-4">
                        <div className="flex-shrink-0 w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                          <MonitorPlay className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-lg font-semibold text-slate-900">Massive Impact</h4>
                          <p className="text-slate-600">Build products that shape how millions of people learn, grow, and improve their lives globally.</p>
                        </div>
                      </li>
                      <li className="flex gap-4">
                        <div className="flex-shrink-0 w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600">
                          <TrendingUp className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-lg font-semibold text-slate-900">Rapid Growth</h4>
                          <p className="text-slate-600">The global EdTech market is expanding rapidly, driving innovation in AI, VR, and personalized learning.</p>
                        </div>
                      </li>
                      <li className="flex gap-4">
                        <div className="flex-shrink-0 w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600">
                          <Lightbulb className="w-5 h-5" />
                        </div>
                        <div>
                          <h4 className="text-lg font-semibold text-slate-900">Intellectual Challenge</h4>
                          <p className="text-slate-600">Solve complex problems combining cognitive science, pedagogy, and cutting-edge engineering.</p>
                        </div>
                      </li>
                    </ul>
                  </div>
                  <div className="flex-1 flex justify-center">
                    <div className="relative">
                      <div className="absolute inset-0 bg-indigo-600 rounded-3xl transform translate-x-4 translate-y-4 opacity-20"></div>
                      <img 
                        src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                        alt="Students collaborating" 
                        className="relative rounded-3xl shadow-xl border border-slate-200 object-cover h-[400px] w-[500px]"
                      />
                    </div>
                  </div>
                </section>

              </main>

              {/* Footer */}
              <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-2">
                    <GraduationCap className="w-6 h-6 text-indigo-400" />
                    <span className="text-lg font-bold text-slate-200">EdTechCareers</span>
                  </div>
                  <div className="flex gap-6">
                    <a href="#" className="hover:text-white transition-colors">About</a>
                    <a href="#" className="hover:text-white transition-colors">Job Board</a>
                    <a href="#" className="hover:text-white transition-colors">Mentorship</a>
                    <a href="#" className="hover:text-white transition-colors">Contact</a>
                  </div>
                  <p className="text-sm text-slate-500">© 2026 EdTechCareers. All rights reserved.</p>
                </div>
              </footer>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
